services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # APIキーはホスト側の .env から渡す。イメージに焼き込まない
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEBATE_MODEL: ${DEBATE_MODEL:-claude-sonnet-5}
      DEBATE_APP_PASSWORD: ${DEBATE_APP_PASSWORD}
      DEBATE_SESSION_SECRET: ${DEBATE_SESSION_SECRET:-}
      DEBATE_MODEL_LIGHT: ${DEBATE_MODEL_LIGHT:-claude-haiku-4-5-20251001}
      ESTAT_APP_ID: ${ESTAT_APP_ID:-}
      DEBATE_DATA_DIR: /app/data
    volumes:
      # これを外すとコンテナを作り直した瞬間に全データが消える
      - ./data:/app/data
    restart: unless-stopped
